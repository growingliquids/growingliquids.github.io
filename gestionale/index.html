/* ================= UTIL ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const iso=(Y,M,D)=>new Date(Y,M-1,D,12).toLocaleDateString('sv');
const today=()=>new Date().toLocaleDateString('sv');
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>(+n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const num=n=>n==null||n===''?'':(+n).toLocaleString('it-IT',{maximumFractionDigits:2});
const dIT=d=>d?d.split('-').reverse().join('/'):'';

/* ================= DATA LAYER =================
   Supabase (schema gl, progetto Growing Liquids). Il resto del codice usa la stessa interfaccia di prima:
   lettura sincrona dalla memoria; ogni scrittura aggiorna subito la memoria e va in una coda verso il server,
   svuotata appena c'è rete (copia locale + coda in localStorage: si lavora anche offline).
   Aggiornamento in tempo reale dalle altre postazioni. 'movimenti' = registro: remove imposta deleted_at.
   Le righe degli ordini stanno in gl.ordini_righe; i campi senza colonna dedicata in extra (o dati). */
const DB=(()=>{const LEDGER=new Set(['movimenti']),TB={pl:'private_label'},CATCH={documenti:'dati',pl:'dati'},KC=_lsKey('cache_v2'),KQ=_lsKey('coda_v2');
  const C_=s=>Object.fromEntries(s.split(',').map(x=>x.split(':')));
  const COLS={fornitori:C_('id:u,rag_soc:t,cantina:t,tipo:t,paese:t,piva:t,eori:t,accisa:t,valuta:t,incoterm:t,pagamento:t,iban:t,email:t,tel:t,referente:t,indirizzo:t,citta:t,note:t,created_at:ts'),

    clienti:C_('id:u,rag_soc:t,tipo:t,gruppo:t,agente_id:u,piva:t,cf:t,sdi:t,indirizzo:t,cap:t,citta:t,prov:t,paese:t,dest:t,orari:t,email:t,tel:t,referente:t,listino:t,sconto:n,pagamento:t,fido:n,wa_id:t,note:t,created_at:ts'),
    mandati:C_('id:u,mandante_id:u,tipo:t,data_inizio:d,data_fine:d,rinnovo_auto:b,preavviso_gg:n,esclusiva:b,zona:t,canali:t,provv_pct:n,provv_base:t,liquidazione:t,minimo:n,enasarco:b,pag_clienti:t,doc_url:t,condizioni:t,created_at:ts'),
    prodotti:C_('id:u,sku:t,nome:t,alias_cantina:t,alias_annata:t,produttore_id:u,distributore_id:u,canale:t,mandato_id:u,annata:t,tipologia:t,formato:t,vitigni:t,paese:t,regione:t,zona:t,denominazione:t,ean:t,costo:n,prezzo:n,prezzo_ingr:n,prezzo_int:n,iva:n,provv_pct:n,cartone:n,scorta_min:n,attivo:b,descr:t,note:t,created_at:ts'),
    ordini:C_('id:u,numero:t,tipo:t,data:d,data_evasione:d,stato:t,cliente_id:u,fornitore_id:u,mandato_id:u,agente_id:u,agente_pct:n,provv_pct:n,valuta:t,cambio:n,costi_acc:n,consegna:d,rif_esterno:t,note:t,mov:b,provv_liq:d,agente_liq:d,fonte:t,ext_id:t,wa_sig:t,manifest_id:u,created_at:ts'),
    movimenti:C_('id:u,data:d,prodotto_id:u,tipo:t,qta:n,lotto:t,costo_unit:n,prezzo_unit:n,rif:t,das:t,ordine_id:u,note:t,deleted_at:ts,created_at:ts'),
    documenti:C_('id:u,tipo:t,numero:n,anno:n,data:d,cliente_id:u,ordine_id:u,righe:j,pagamento:t,scadenza:d,pagata:b,data_incasso:d,created_at:ts'),
    passive:C_('id:u,fornitore_id:u,numero:t,data:d,rif_ordine:t,ordine_id:u,valuta:t,imponibile:n,iva:n,totale:n,pagamento:t,scadenza:d,pagata:b,data_pag:d,note:t,created_at:ts'),
    pl:C_('id:u,nome:t,prodotto_id:u,slug:t,qr_stampato:b,created_at:ts'),
    fallate:C_('id:u,num:t,data:d,cliente_id:u,prodotto_id:u,fornitore_id:u,lotto:t,qta:n,difetto:t,descr:t,rif:t,stato:t,stato_forn:t,data_segn:d,credito:n,note:t,created_at:ts')};
  const COLL=Object.keys(COLS),SHARED=['azienda','pricing'],WASH=['mandato_id','da','agenti','map'];
  let d={},seq={},q=[],shared='',ready=false,ch=null,tFl=0,tRe=0,busy=false;
  try{const c=JSON.parse(localStorage.getItem(KC));if(c){d=c.d||{};seq=c.seq||{};shared=c.shared||''}}catch{}try{q=JSON.parse(localStorage.getItem(KQ))||[]}catch{q=[]}
  const raw=c=>d[c]||(d[c]=[]),save=()=>{try{localStorage.setItem(KC,JSON.stringify({d,seq,shared}));localStorage.setItem(KQ,JSON.stringify(q))}catch(e){console.warn('Copia locale non salvata',e)}};
  const conv=(t,v)=>t==='n'?(v===''||v==null||isNaN(+v)?null:+v):t==='d'?(v?String(v).slice(0,10):null):t==='u'||t==='ts'?(v||null):t==='b'?!!v:t==='j'?v:(v==null?null:String(v));
  function toRow(c,o){const cols=COLS[c],k=CATCH[c]||'extra',row={},ex={};
    for(const[f,v]of Object.entries(o)){if(f==='updated_at'||(c==='ordini'&&f==='righe'))continue;const t=cols[f];if(!t){if(v!==undefined)ex[f]=v;continue}if(t==='b'&&v==null)continue;row[f]=conv(t,v)}
    row[k]=ex;return row}
  function fromRow(c,r){const k=CATCH[c]||'extra',o={...(r[k]||{}),...r};delete o[k];delete o.creato_da;return o}
  const sharedOf=s=>JSON.stringify({...Object.fromEntries(SHARED.map(k=>[k,s[k]||null])),wa:Object.fromEntries(WASH.map(k=>[k,s.wa?.[k]??null]))});
  const put=(c,o)=>{const a=raw(c),i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o};
  const status=()=>{for(const el of document.querySelectorAll('[data-dbst]'))el.textContent=q.length?`${q.length} ${q.length>1?'modifiche':'modifica'} da inviare`:(ready?'Dati sincronizzati':'Caricamento dati…')};
  const enqueue=op=>{q.push(op);save();status();clearTimeout(tFl);tFl=setTimeout(flush,300)};
  const sb=()=>AUTH.sb;
  async function fetchAll(t,sel='*'){const out=[];for(let i=0;;i+=1000){const{data,error}=await sb().from(t).select(sel).range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
  async function flush(){if(busy||!q.length||!sb()||!AUTH.prof)return;busy=true;
    try{while(q.length){const op=q[0];let r;
        if(op.op==='up'){r=await sb().from(TB[op.c]||op.c).upsert(toRow(op.c,op.o));if(!r.error&&op.c==='ordini')r=await sb().rpc('sostituisci_righe',{p_ordine:op.o.id,p_righe:(op.o.righe||[]).map(x=>({prodotto_id:x.prodotto_id||'',descr:x.descr||'',qta:x.qta,prezzo:x.prezzo,sconto:x.sconto,iva:x.iva}))})}
        else if(op.op==='canc')r=await sb().from(TB[op.c]||op.c).update({deleted_at:op.at}).eq('id',op.id);
        else if(op.op==='del')r=await sb().from(TB[op.c]||op.c).delete().eq('id',op.id);
        else if(op.op==='num')r=await sb().rpc('allinea_contatore',{p_chiave:op.k,p_valore:op.v});
        else if(op.op==='set')r=await sb().from('impostazioni').upsert({chiave:'app',valore:JSON.parse(op.v)});
        if(r?.error){const m=r.error.message||'';if(/fetch|network|Failed|timeout/i.test(m)||!r.error.code)break;
          q.shift();save();alert('Il server ha rifiutato una modifica e i dati sono stati ricaricati.\n\n'+(r.error.code==='23505'?'Numero o codice già usato da un\'altra postazione.':m));await sync();continue}
        q.shift();save()}}
    catch(e){console.warn('Coda non svuotata',e)}finally{busy=false;status()}}
  /* carica tutto dal server, poi riapplica le modifiche ancora in coda */
  async function sync(){if(!sb())return;const res=await Promise.all([...COLL.map(c=>fetchAll(TB[c]||c)),fetchAll('ordini_righe'),fetchAll('contatori'),sb().from('impostazioni').select('*').eq('chiave','app').maybeSingle()]);
    const nd={settings:d.settings||{}};COLL.forEach((c,i)=>nd[c]=res[i].map(r=>fromRow(c,r)));
    const rg={};for(const r of res[COLL.length].sort((a,b)=>(a.pos||0)-(b.pos||0)))(rg[r.ordine_id]||=[]).push({prodotto_id:r.prodotto_id,descr:r.descr,qta:+r.qta,prezzo:+r.prezzo,sconto:+r.sconto,iva:+r.iva});
    for(const o of nd.ordini)o.righe=rg[o.id]||[];
    seq={};for(const r of res[COLL.length+1])seq[r.chiave]=r.valore;
    const st=res[COLL.length+2].data?.valore;if(st){for(const k of SHARED)if(st[k])nd.settings[k]=st[k];if(st.wa){nd.settings.wa=Object.assign(nd.settings.wa||{},st.wa)}shared=sharedOf(nd.settings)}
    d=nd;for(const op of q){if(op.op==='up')put(op.c,structuredClone(op.o));else if(op.op==='del')d[op.c]=raw(op.c).filter(x=>x.id!==op.id);else if(op.op==='canc'){const x=raw(op.c).find(x=>x.id===op.id);if(x)x.deleted_at=op.at}else if(op.op==='num')seq[op.k]=Math.max(seq[op.k]||0,op.v)}
    ready=true;save();status()}
  const later=()=>{clearTimeout(tRe);tRe=setTimeout(()=>{if(!$('#dlg').open)render()},400)};
  function live(){if(ch||!sb())return;const pend=id=>q.some(op=>op.o?.id===id||op.id===id);
    ch=sb().channel('gl-dati').on('postgres_changes',{event:'*',schema:'gl'},async ev=>{const t=ev.table,c=Object.keys(TB).find(k=>TB[k]===t)||t,n=ev.new||{},o=ev.old||{};
      if(t==='contatori'){if(n.chiave)seq[n.chiave]=n.valore}
      else if(t==='impostazioni'){if(n.valore){const s=DB.settings();for(const k of SHARED)if(n.valore[k])s[k]=n.valore[k];if(n.valore.wa)s.wa=Object.assign(s.wa||{},n.valore.wa);shared=sharedOf(s)}}
      else if(t==='ordini_righe'){const oid=n.ordine_id||o.ordine_id;if(oid&&!pend(oid)){const{data}=await sb().from('ordini_righe').select('*').eq('ordine_id',oid).order('pos');const x=raw('ordini').find(x=>x.id===oid);if(x&&data)x.righe=data.map(r=>({prodotto_id:r.prodotto_id,descr:r.descr,qta:+r.qta,prezzo:+r.prezzo,sconto:+r.sconto,iva:+r.iva}))}}
      else if(COLS[c]){const id=n.id||o.id;if(!id||pend(id))return;if(ev.eventType==='DELETE')d[c]=raw(c).filter(x=>x.id!==id);else{const x=fromRow(c,n),p=raw(c).find(y=>y.id===id);if(c==='ordini')x.righe=p?.righe||[];put(c,x)}}
      save();later()}).subscribe()}
  return{
    all:c=>LEDGER.has(c)?raw(c).filter(x=>!x.deleted_at):raw(c),
    get:(c,id)=>id?raw(c).find(x=>x.id===id&&!x.deleted_at):undefined,
    upsert(c,o){const now=new Date().toISOString();o.id||=uid();o.created_at||=now;o.updated_at=now;put(c,o);enqueue({op:'up',c,o:structuredClone(o)});return o},
    remove(c,id){const x=raw(c).find(x=>x.id===id);if(LEDGER.has(c)){if(x){x.deleted_at=new Date().toISOString();enqueue({op:'canc',c,id,at:x.deleted_at})}return}
      if(c==='documenti'&&x&&seq[x.tipo+x.anno]===+x.numero)seq[x.tipo+x.anno]--;d[c]=raw(c).filter(y=>y.id!==id);enqueue({op:'del',c,id})},
    settings:()=>d.settings||(d.settings={}),
    saveSettings(){save();const s=sharedOf(this.settings());if(s!==shared&&AUTH.prof?.ruolo==='admin'){shared=s;enqueue({op:'set',v:s})}},
    nextNum(key,y=''){const k=key+y,v=(seq[k]||0)+1;seq[k]=v;enqueue({op:'num',k,v});return v},
    seqOf:k=>seq[k]||0,
    async start(){await flush();await sync();live();await flush();render();setInterval(flush,30000);addEventListener('online',flush)},
    pending:()=>q.length,ready:()=>ready,status,
    /* dati del vecchio gestionale (solo browser, chiave gl_db_v1) da caricare su Supabase */
    vecchi(){try{const x=JSON.parse(localStorage.getItem(_lsKey('db_v1')))||{};return COLL.reduce((s,c)=>s+(x[c]||[]).length,0)}catch{return 0}},
    importaVecchi(){const x=JSON.parse(localStorage.getItem(_lsKey('db_v1'))||'{}');let n=0;
      for(const c of ['fornitori','agenti','clienti','mandati','prodotti','ordini','movimenti','documenti','passive','pl','fallate'])for(const o of x[c]||[]){if(raw(c).some(y=>y.id===o.id))continue;put(c,o);enqueue({op:'up',c,o:structuredClone(o)});n++}
      for(const[k,v]of Object.entries(x.settings?.seq||{}))if(v>(seq[k]||0)){seq[k]=v;enqueue({op:'num',k,v})}
      const s=this.settings();for(const k of SHARED)if(x.settings?.[k]&&!s[k])s[k]=x.settings[k];if(x.settings?.wa)s.wa=Object.assign({},x.settings.wa,s.wa||{});this.saveSettings();
      localStorage.setItem(_lsKey('db_v1_caricato'),new Date().toISOString());return n},
    dump:()=>JSON.stringify(d),
    load(j){const x=JSON.parse(j);if(typeof x!=='object'||!x)throw Error('JSON non valido');let n=0;for(const c of COLL)for(const o of x[c]||[]){put(c,o);enqueue({op:'up',c,o:structuredClone(o)});n++}return n},
    reset(){localStorage.removeItem(KC);localStorage.removeItem(KQ);location.reload()}
  }})();

function fieldHTML([k,l,t='text',req,opts],v){const r=req?' required':'';v=v??'';let i;
  if(t==='area')i=`<textarea name="${k}"${r}>${esc(v)}</textarea>`;
  else if(t==='sel')i=`<select name="${k}"${r}><option value=""></option>${opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return`<option value="${esc(ov)}"${String(ov)===String(v)||(k==='formato'&&v!==''&&parseFloat(ov)===parseFloat(v))?' selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(t.startsWith('ref:')){const c=t.slice(4);let list=DB.all(c);if(c==='prodotti')list=[...list].sort(somCmp);i=`<select name="${k}"${r}><option value=""></option>${list.map(o=>`<option value="${o.id}"${o.id===v?' selected':''}>${esc(label(c,o))}</option>`).join('')}</select>`}
  else if(t==='chk')i=`<input type="checkbox" name="${k}"${v?' checked':''}>`;
  else i=`<input name="${k}" type="${t==='num'?'number':t}"${t==='num'?' step="any" inputmode="decimal"':''} value="${esc(v)}"${r}${AC.has(k)?` list="dl-${k}" autocomplete="off"`:''}>`;

function datalists(root){const keys=new Set([...root.querySelectorAll('input[list]')].map(i=>i.getAttribute('list').slice(3)));let h='';
  for(const k of keys){const v=new Set(SEED[k]||[]);for(const c of ['clienti','fornitori','prodotti','mandati','documenti'])for(const o of DB.all(c))if(o[k])v.add(o[k]);h+=`<datalist id="dl-${k}">${[...v].sort((a,b)=>a.localeCompare(b)).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}

/* ================= CALCOLI ================= */
const lineTot=r=>r2((+r.qta||0)*(+r.prezzo||0)*(1-(+r.sconto||0)/100));
function totals(righe=[]){const by={};let imp=0;for(const r of righe){const t=lineTot(r);imp+=t;by[+r.iva||0]=(by[+r.iva||0]||0)+t}
  let iva=0;const det=Object.entries(by).map(([a,b])=>{const v=r2(b*a/100);iva+=v;return{a:+a,imp:r2(b),iva:v}});return{imp:r2(imp),iva:r2(iva),tot:r2(imp+iva),det}}
/* FIFO per prodotto: lotti residui, valore, scoperto (scarichi oltre giacenza) */
function stockMap(){const by={},m={};for(const x of DB.all('movimenti'))(by[x.prodotto_id]||=[]).push(x);
  for(const [pid,arr] of Object.entries(by)){const p=DB.get('prodotti',pid);arr.sort((a,b)=>a.data.localeCompare(b.data)||(SIGN[b.tipo]?1:0)-(SIGN[a.tipo]?1:0)||a.created_at.localeCompare(b.created_at));
    const lots=[];let q=0,over=0;
    for(const x of arr){const n=+x.qta||0;if(SIGN[x.tipo]){lots.push({q:n,c:x.costo_unit??(+p?.costo||0),l:x.lotto||''});q+=n}else{q-=n;let r=n;while(r>0&&lots.length){const L=lots[0],t=Math.min(r,L.q);L.q-=t;r-=t;if(!L.q)lots.shift()}over+=r}}
    m[pid]={q,lots,over,val:lots.reduce((s,L)=>s+L.q*L.c,0)}}return m}
const avgCost=(p,s)=>s&&s.q>0?s.val/s.q:(+p?.costo||0);
function fifoTake(s,qty,p){let r=qty,c=0;for(const L of s?.lots||[]){if(r<=0)break;const t=Math.min(r,L.q);c+=t*L.c;L.q-=t;r-=t}if(s)s.lots=s.lots.filter(L=>L.q>0);c+=r*(+p?.costo||0);return qty?Math.round(c/qty*1e4)/1e4:0}
function provvRows(f={}){return DB.all('ordini').filter(o=>o.tipo==='agenzia'&&['Confermato','Evaso'].includes(o.stato)&&(!f.m||o.mandato_id===f.m)&&(!f.da||o.data>=f.da)&&(!f.a||o.data<=f.a)&&(!f.st||(f.st==='liq')===!!o.provv_liq))
  .map(o=>({o,...ourProvv(o)})).sort((a,b)=>b.o.data.localeCompare(a.o.data))}
/* ordini dal CRM Wine Alchemist: la provvigione matura quando il cliente paga (wa_pagato) */
const provvAttesa=o=>o.fonte==='CRM Wine Alchemist'&&!o.wa_pagato&&!o.provv_liq;
function ourProvv(o){const m=DB.get('mandati',o.mandato_id)||{};let imp=0,pv=0;for(const r of o.righe){const t=lineTot(r);const pct=o.provv_pct??DB.get('prodotti',r.prodotto_id)?.provv_pct??m.provv_pct??0;imp+=t;pv+=t*pct/100}return{m,imp:r2(imp),pv:r2(pv)}}
/* provvigioni agenti: vendite dirette = % su imponibile; mandati = quota della nostra provvigione (o % override su imponibile).
   Maturazione all'incasso: vendite = fatture dell'ordine incassate; mandati = nostra provvigione liquidata dal mandante. */
function agentRows(f={}){const docs=DB.all('documenti');return DB.all('ordini').filter(o=>o.agente_id&&['Confermato','Evaso'].includes(o.stato)&&o.tipo!=='acquisto'&&(!f.ag||o.agente_id===f.ag)&&(!f.da||o.data>=f.da)&&(!f.a||o.data<=f.a)).map(o=>{
    const ag=DB.get('agenti',o.agente_id)||{},imp=totals(o.righe).imp;let pv;
    if(o.agente_pct!=null)pv=imp*o.agente_pct/100;else if(o.tipo==='vendita')pv=imp*(+ag.pct_vendita||0)/100;else pv=ourProvv(o).pv*(+ag.quota_mandati||0)/100;
    const ft=docs.filter(d=>d.ordine_id===o.id&&d.tipo==='fattura'&&!isNC(d)),inc=o.tipo==='vendita'?ft.length>0&&ft.every(d=>d.pagata):!!o.provv_liq;
    const mat=ag.maturazione==="All'evasione"?o.stato==='Evaso':inc;return{o,ag,imp:r2(imp),pv:r2(pv),st:o.agente_liq?'liq':mat?'mat':'att'}})
  .filter(r=>!f.st||r.st===f.st).sort((a,b)=>b.o.data.localeCompare(a.o.data))}

const PLANCIA_AIUTO=`<details class="card" style="margin-top:14px"><summary><b>Come leggere la plancia</b></summary><ul class="guida">
<li><b>Venduto diretto</b>: imponibile delle vendite di Growing Liquids evase nel periodo. <b>Margine lordo</b>: venduto meno il costo delle bottiglie uscite, al costo registrato quando sono uscite.</li>
<li><b>Venduto in agenzia</b>: ordini presi su mandato (per esempio Wine Alchemist): la merce non passa da noi, guadagniamo la provvigione.</li>
<li><b>Provvigioni su ordini del periodo</b>: quanto vale la provvigione degli ordini con data nel periodo scelto.</li>
<li><b>Provvigioni mandati da incassare</b>: tutto ciò che i mandanti ci devono, di qualsiasi periodo. Sotto: quanto è già maturato (il cliente ha pagato) e quanto aspetta il pagamento del cliente.</li>
<li><b>Acquisti</b>: costo pieno della merce comprata, comprese le spese di trasporto e dogana ripartite sulle bottiglie.</li>
<li><b>Valore magazzino</b>: bottiglie in giacenza al loro costo d'acquisto, consumando prima i lotti più vecchi (FIFO).</li>
<li><b>Da incassare / da pagare</b>: fatture emesse e ricevute non ancora saldate, per scadenza.</li></ul></details>`;
VIEWS.guida=()=>`<div class="bar"><h2>Guida rapida</h2></div><div class="card guida">
<h3>Vendere a un cliente</h3><ol><li>Nuovo, Ordine di vendita: scegli il cliente, aggiungi i vini. Il prezzo arriva dal listino del cliente (HoReCa, ingrosso o gruppo).</li><li>Quando la merce parte premi Evadi: le bottiglie escono dal magazzino e il costo resta registrato.</li><li>Dai pulsanti dell'ordine crei DDT e fattura (copia di cortesia: l'originale va allo SDI dal vostro programma di fatturazione).</li><li>Quando incassi, in Fatture e DDT premi Incassata.</li></ol>
<h3>Comprare da un produttore</h3><ol><li>Nuovo, Ordine d'acquisto: fornitore, vini, prezzi. Per l'estero indica valuta, cambio e costi accessori (trasporto, dogana, accise) se non sono già nel prezzo.</li><li>Quando la merce arriva premi Ricevi: entra in magazzino al costo pieno per bottiglia.</li><li>Registra la fattura del fornitore (Nuovo, Fattura ricevuta): la trovi in Scadenze finché non la segni pagata.</li></ol>
<h3>Ordini Wine Alchemist e provvigioni</h3><ol><li>Gli ordini del CRM arrivano da soli quando Wine Alchemist li conferma (Impostazioni, Collegamento CRM).</li><li>La provvigione matura quando il cliente paga: lo stato si aggiorna dal CRM.</li><li>In Provvigioni, scheda Da incassare, stampi l'estratto conto e segni quando Wine Alchemist ha liquidato.</li></ol>
<h3>Magazzino</h3><p>Ogni carico, scarico, reso o rottura è un movimento. I movimenti non si modificano: se sbagli, annulli e ne registri uno nuovo. Così i numeri per il commercialista restano coerenti.</p>
<h3>Fallate</h3><p>Il cliente segnala una bottiglia difettosa: Nuovo, Fallata. Da lì mandi la segnalazione al fornitore e registri la sostituzione.</p>
<h3>Private label</h3><p>Ogni vino a marchio ha una scheda con ingredienti, valori nutrizionali e QR della pagina e-label. Quando l'etichetta va in stampa spunta «QR già in stampa»: l'indirizzo non potrà più cambiare.</p>
<h3>Dati e sicurezza</h3><p>I dati stanno sul server di Growing Liquids e si vedono da ogni postazione dopo l'accesso. Senza rete si continua a lavorare: le modifiche partono appena torna la connessione (lo stato è in fondo al menù). Ogni notte c'è un backup automatico.</p></div>`;

      if(miss.length&&!confirm(`Giacenza insufficiente per ${miss.length} referenze: l'eccedenza verrà valorizzata a costo standard e segnalata come scoperto. Procedere?`))return}
    let lotto='';if(o.tipo==='acquisto'){lotto=prompt('Lotto (opzionale):','');if(lotto===null)return}
    const cambio=+o.cambio||1,base=o.righe.reduce((s,r)=>s+lineTot(r),0),acc=+o.costi_acc||0;

      if(o.tipo==='acquisto'){m.tipo='Carico';autoSoglia(r.prodotto_id,r.qta);m.costo_unit=Math.round((lt*cambio+(base?acc*lt/base:0))/r.qta*1e4)/1e4;m.lotto=lotto}
      else{m.tipo='Scarico';m.costo_unit=fifoTake(sm[r.prodotto_id],r.qta,DB.get('prodotti',r.prodotto_id));m.prezzo_unit=Math.round(lt/r.qta*1e4)/1e4}

function parseCSV(txt){txt=txt.replace(/^\ufeff/,'');const h=txt.split(/\r?\n/)[0],sep=(h.match(/;/g)||[]).length>(h.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const pnum=v=>{v=String(v??'').replace(/[€\s]/g,'');if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,'').replace(',','.');return +v||0};
const pdate=v=>{v=String(v||'').trim();const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);return m?`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):today()};

    const mid=f.elements.mandato_id.value;f.elements.file.files[0].text().then(txt=>{const rows=parseCSV(txt);if(rows.length<2)return alert('CSV vuoto');
      const H=rows[0].map(h=>h.toLowerCase().trim()),col=re=>H.findIndex(h=>re.test(h));
      const ix={data:col(/^data|date/),ord:col(/ordine|order|^n[°.]?$|numero|^id$/),cli:col(/cliente|client|locale|ragione/),vino:col(/vino|referenza|prodotto|articolo|descr|wine/),qta:col(/q\.?t|quant|bott|pezzi/),pr:col(/prezzo|price|unit/),tot:col(/totale|importo|total/)};
      if(ix.cli<0||ix.vino<0||ix.qta<0)return alert('Colonne obbligatorie (cliente, vino, quantità) non trovate.\nIntestazioni: '+H.join(' | '));
      const groups=new Map();for(const r of rows.slice(1)){const g=c=>c<0?'':(r[c]??'').trim(),key=g(ix.ord)||`${g(ix.data)}|${g(ix.cli)}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(g)}
      const ext=new Set(DB.all('ordini').map(o=>o.ext_id).filter(Boolean)),cli=new Map(DB.all('clienti').map(c=>[c.rag_soc.toLowerCase(),c])),prd=new Map(DB.all('prodotti').map(p=>[p.nome.toLowerCase(),p]));let n=0,sk=0;
      for(const [key,lines] of groups){const eid='wa:'+key;if(ext.has(eid)){sk++;continue}const g0=lines[0],cn=g0(ix.cli);if(!cn)continue;
        let c=cli.get(cn.toLowerCase());if(!c){c=DB.upsert('clienti',{rag_soc:cn,tipo:'Ristorante',gruppo:'Esterno',note:'Creato da import CRM Wine Alchemist'});cli.set(cn.toLowerCase(),c)}
        const righe=lines.map(g=>{const q=pnum(g(ix.qta));let pr=pnum(g(ix.pr));if(!pr&&ix.tot>=0&&q)pr=r2(pnum(g(ix.tot))/q);const p=prd.get(g(ix.vino).toLowerCase());return{prodotto_id:p?.id||null,descr:g(ix.vino),qta:q,prezzo:pr,sconto:0,iva:22}}).filter(r=>r.qta);
        if(!righe.length)continue;const data=pdate(g0(ix.data)),y=data.slice(0,4);
        DB.upsert('ordini',{tipo:'agenzia',numero:`AG-${y}-${String(DB.nextNum('ordagenzia',y)).padStart(4,'0')}`,data,data_evasione:data,stato:'Evaso',cliente_id:c.id,agente_id:c.agente_id||null,mandato_id:mid,righe,fonte:'CRM Wine Alchemist',ext_id:eid,rif_esterno:key.includes('|')?'':key});n++}

/* Ogni documento fotografa all'emissione i dati del cliente (d.cli) e i propri parametri fiscali:
   una modifica successiva alla scheda cliente non cambia i documenti già emessi.
   Tipo SDI in d.td (TD01 fattura, TD24 differita, TD04 nota di credito): la nota di credito condivide
   la numerazione delle fatture (tipo 'fattura'), quindi resta valida la guardia lato server. */
const TD={TD01:'Fattura',TD24:'Fattura differita',TD04:'Nota di credito'};
const isNC=d=>d.tipo==='fattura'&&d.td==='TD04';
const docNome=d=>d.tipo==='ddt'?'DDT':TD[d.td]||'Fattura';
const MODP=['Bonifico','RiBa','Contanti','Carta di pagamento','Assegno','SEPA Direct Debit'];
const CAUS_DDT=['Vendita','Conto visione','Conto deposito','Campionatura','Omaggio','Reso da cliente','Reso a fornitore','Trasferimento tra sedi'];
const ASPETTO=['Cartoni','Casse in legno','Pallet','Sfuso','Confezioni regalo'];
const CLIF=[['rag_soc','Ragione sociale'],['nome','Nome (se privato)'],['cognome','Cognome'],['piva','P.IVA'],['cf','Codice fiscale'],['sdi','Codice SDI'],['pec','PEC','email'],['indirizzo','Indirizzo sede'],['cap','CAP'],['citta','Comune'],['prov','Prov.'],['paese','Nazione'],['email','Email','email'],['tel','Telefono']];
function cliSnap(c){const s=String(c.sdi||'').trim(),pec=s.includes('@');return{rag_soc:c.rag_soc||'',nome:'',cognome:'',piva:c.piva||'',cf:c.cf||'',sdi:pec?'':s,pec:pec?s:'',indirizzo:c.indirizzo||'',cap:c.cap||'',citta:c.citta||'',prov:c.prov||'',paese:c.paese||'IT',email:c.email||'',tel:c.tel||''}}
const docCli=d=>d.cli||cliSnap(DB.get('clienti',d.cliente_id)||{});
/* bollo 2 € dovuto se le operazioni senza IVA superano 77,47 € (DPR 642/1972), salvo scelta manuale */
function bolloDovuto(d){if(d.tipo!=='fattura'||d.bollo==='no')return false;if(d.bollo==='si')return true;return totals(d.righe).det.filter(x=>!x.a).reduce((s,x)=>s+x.imp,0)>77.47}
/* importo dovuto dal cliente, con segno: split payment = solo imponibile; nota di credito negativa */
function docTot(d){const t=totals(d.righe);let v=d.esig==='S'?t.imp:t.tot;if(d.bollo_add&&bolloDovuto(d))v+=2;return r2(isNC(d)?-v:v)}
const ivaIT=c=>!c.paese||/^(it|ita|italia|italy)$/i.test(c.paese.trim());
function ibanOk(s){s=String(s).replace(/\s/g,'').toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return false;let m=0;for(const ch of (s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55))m=(m*10+ +ch)%97;return m===1}
/* validazione: restituisce il primo errore bloccante, altrimenti '' */
function docCheck(c,d){const it=ivaIT(c),pi=String(c.piva||'').replace(/^IT/i,'').replace(/\s/g,'');
  if(!c.rag_soc&&!(c.nome&&c.cognome))return'Indica la ragione sociale del cliente, oppure nome e cognome se è un privato.';
  if(d.tipo==='fattura'&&!pi&&!c.cf)return'Per la fattura serve la P.IVA o il codice fiscale del cliente.';
  if(pi&&it&&!/^\d{11}$/.test(pi))return'P.IVA non valida: servono 11 cifre.';
  if(c.cf&&!/^([A-Z0-9]{16}|\d{11})$/i.test(c.cf))return'Codice fiscale non valido: 16 caratteri (persona) o 11 cifre (società).';
  if(c.sdi&&!/^[A-Z0-9]{6,7}$/i.test(c.sdi))return'Codice SDI non valido: 7 caratteri (6 per la Pubblica Amministrazione).';
  if(c.cap&&it&&!/^\d{5}$/.test(c.cap))return'CAP non valido: 5 cifre.';
  if(c.prov&&it&&!/^[A-Z]{2}$/i.test(c.prov))return'Provincia: usa la sigla di 2 lettere (es. MI).';
  if(d.iban&&!ibanOk(d.iban))return'IBAN non valido: controlla le cifre.';
  if(d.dest_div&&!d.destinazione)return'Indica il luogo di destinazione o togli la spunta.';
  if(isNC(d)&&!d.rif_fattura)return'Indica la fattura stornata dalla nota di credito.';
  if(d.tipo==='ddt'&&d.vettore==='Vettore'&&!d.vettore_nome)return'Indica i dati del vettore.';
  if(d.colli!=null&&(d.colli<0||!Number.isInteger(d.colli)))return'Il numero di colli deve essere un intero positivo.';
  if(d.peso!=null&&d.peso<0)return'Il peso non può essere negativo.';return''}
function docDefaults(tipo,c,righe,td='TD01'){const a=DB.settings().azienda||{},base={cli:cliSnap(c),dest_div:!!c.dest,destinazione:c.dest||''};
  if(tipo==='fattura'){const p=c.pagamento||'';return{...base,td,pagamento:p,scadenza:dueDate(today(),p),pagata:false,esig:'I',bollo:'auto',bollo_add:false,modalita:/riba/i.test(p)?'RiBa':/bonifico/i.test(p)?'Bonifico':'',iban:a.iban||'',banca:a.banca||''}}
  const cart=righe.reduce((s,r)=>{const p=DB.get('prodotti',r.prodotto_id);return s+(p?.cartone?Math.ceil(r.qta/p.cartone):0)},0);
  return{...base,causale:'Vendita',aspetto:'Cartoni',vettore:'Mittente',porto:'Franco',data_trasp:today(),colli:cart||null,valorizzato:false}}
/* Editor unico di fatture, note di credito e DDT (modello: Cantina Manager di Osteria Lagrandissima).
   Tre casi: nuovo documento libero (righe e cliente modificabili), nuovo da ordine (righe e cliente dell'ordine),
   documento già emesso (righe e cliente bloccati, come impone la guardia sul server).
   Il numero si assegna solo al salvataggio: chiudere senza salvare non consuma numeri.

const KINDS=[['TD01','Fattura'],['TD24','Fattura differita'],['TD04','Nota di credito'],['ddt','DDT (documento di trasporto)']];
const kindOf=d=>d.tipo==='ddt'?'ddt':d.td||'TD01';
const FT='TD01 TD24 TD04';

const FS=(()=>{let dbp;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(_lsKey('files'),1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})};
  const bk=()=>AUTH.sb.storage.from('allegati'),P=id=>'f/'+id,up=(id,b)=>bk().upload(P(id),b,{contentType:b.type||'application/octet-stream',upsert:false});
  const dup=e=>/exist|duplicate|409/i.test(e?.message||e?.statusCode||'');
  return{
    async put(id,b){if(b.size>26214400)throw Error(`${b.name||'Il file'} supera 25 MB`);const{error}=await up(id,b);if(error)throw error},
    async get(id){const{data}=await bk().download(P(id));if(data)return data;
      const loc=await tx('readonly',s=>s.get(id)).catch(()=>null);if(loc)up(id,loc).catch(()=>{});return loc||null},
    async del(id){const{error}=await bk().remove([P(id)]);if(error)throw error;tx('readwrite',s=>s.delete(id)).catch(()=>{})},
    async migra(){const keys=await tx('readonly',s=>s.getAllKeys()).catch(()=>[]);let n=0;
      for(const k of keys||[]){const b=await tx('readonly',s=>s.get(k)).catch(()=>null);if(!b)continue;const{error}=await up(k,b);if(!error||dup(error)){n++;await tx('readwrite',s=>s.delete(k)).catch(()=>{})}}
      if(n)toast(n+' allegati spostati dal browser allo spazio condiviso');return n}}})();

  ${plBase()?'':'<p class="muted">Imposta in Impostazioni l\'indirizzo base delle e-label (la pagina GitHub Pages di Growing Liquids) per generare link e QR.</p>'}

    {h:'',a:1,v:p=>B('edit',I('edit'),p.id,'sm','data-c="pl"','Modifica')+B('pl-prev',I('eye'),p.id,'sm','','Anteprima e-label')+B('pl-page',I('dl')+'Pagina',p.id,'sm','','Scarica la pagina da pubblicare')+B('pl-qr',I('qr')+'QR',p.id)+B('pl-files',I('doc')+'File',p.id)+B('del',I('del'),p.id,'sm','data-c="pl"','Elimina')}],rows)}
  <div class="card" style="margin-top:14px"><h3>Pubblicare una e-label</h3><p class="muted">1. Compila la scheda e controlla l'anteprima. 2. Scarica la pagina e caricala nel repository GitHub Pages di Growing Liquids, nella cartella dell'indirizzo base. 3. Apri il link dal telefono per verificarlo. 4. Scarica il QR in SVG per la tipografia e segnalo "in stampa": da quel momento l'indirizzo è bloccato. La pagina non contiene script, cookie o tracciamenti.</p></div>`};
function elabelHTML(p){const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'),a=DB.settings().azienda||{};
  const trasc=(+p.grassi||0)<0.5&&(+p.saturi||0)<0.1&&(+p.proteine||0)<0.5&&(+p.sale||0)<0.0125;
  const L={it:{ing:'Ingredienti',nut:'Dichiarazione nutrizionale',per:'per 100 ml',en:'Energia',fat:'Grassi',sat:'di cui acidi grassi saturi',carb:'Carboidrati',sug:'di cui zuccheri',pro:'Proteine',salt:'Sale',neg:'Contiene quantità trascurabili di grassi, acidi grassi saturi, proteine e sale.',disp:'Smaltimento dell\'imballaggio',info:'Informazioni'},
    en:{ing:'Ingredients',nut:'Nutrition declaration',per:'per 100 ml',en:'Energy',fat:'Fat',sat:'of which saturates',carb:'Carbohydrate',sug:'of which sugars',pro:'Protein',salt:'Salt',neg:'Contains negligible amounts of fat, saturates, protein and salt.'}};
  const hasEn=!!(p.ingredienti_en||'').trim();
  const sec=lang=>{const t=L[lang],rows=[[t.en,`${p.kj??0} kJ / ${p.kcal??0} kcal`]];if(!trasc)rows.push([t.fat,fN(p.grassi)+' g'],[t.sat,fN(p.saturi)+' g']);rows.push([t.carb,fN(p.carbo)+' g'],[t.sug,fN(p.zucc)+' g']);if(!trasc)rows.push([t.pro,fN(p.proteine)+' g'],[t.salt,(+p.sale||0)<0.0125?'0 g':String(r1(+p.sale*10)/10).replace('.',',')+' g']);
    return `<section id="${lang}" lang="${lang}"><h2>${t.ing}</h2><p>${md(lang==='it'?p.ingredienti:p.ingredienti_en)}</p><h2>${t.nut} <small>${t.per}</small></h2><table>${rows.map(([x,y])=>`<tr><th>${x}</th><td>${y}</td></tr>`).join('')}</table>${trasc?`<p class="s">${t.neg}</p>`:''}${lang==='it'&&p.smaltimento?`<h2>${t.disp}</h2><p>${md(p.smaltimento)}</p>`:''}${lang==='it'&&p.info?`<h2>${t.info}</h2><p>${md(p.info)}</p>`:''}</section>`};
  const meta=[p.denominazione,p.tipologia,p.annata,p.volume,p.gradi!=null&&String(p.gradi).replace('.',',')+'% vol'].filter(Boolean).map(esc).join(' · ');
  return `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>${esc(p.nome)} – e-label</title><style>body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1c1a;background:#f7f6f3}main{max-width:560px;margin:0 auto;padding:28px 18px 40px}header{border-bottom:1px solid #ddd;padding-bottom:14px}h1{font-family:'Times New Roman',Times,serif;font-weight:400;font-size:28px;margin:0 0 4px}.m{color:#666;font-size:14px}nav{margin-top:12px;font-size:14px}nav a{color:#1c1c1a;margin-right:14px}h2{font-size:16px;margin:24px 0 8px}h2 small{font-weight:400;color:#666}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #ddd;border-radius:6px}th,td{padding:9px 12px;border-bottom:1px solid #eee;text-align:left;font-weight:400}td{text-align:right;font-weight:600}tr:last-child th,tr:last-child td{border:0}.s{font-size:14px;color:#444}section+section{border-top:1px solid #ddd;margin-top:30px}footer{margin-top:34px;font-size:12px;color:#888}</style></head><body><main><header><h1>${esc(p.nome)}</h1><div class="m">${meta}</div>${hasEn?'<nav><a href="#it">Italiano</a><a href="#en">English</a></nav>':''}</header>${sec('it')}${hasEn?sec('en'):''}<footer>${esc(a.rag_soc||CONFIG.nome)}</footer></main></body></html>`}
function plCheck(p){const miss=[!(p.ingredienti||'').trim()&&'ingredienti',p.kcal==null&&'energia',p.carbo==null&&'carboidrati',p.gradi==null&&'titolo alcolometrico'].filter(Boolean);return miss.length?'Mancano: '+miss.join(', ')+'.':''}
function qrSVG(text){if(typeof qrcode!=='function')throw Error('Libreria QR non caricata: serve la connessione al primo avvio.');const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=4,z=n+2*m;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${z} ${z}" width="${z*10}" height="${z*10}" shape-rendering="crispEdges"><rect width="${z}" height="${z}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function svgPng(svg,px,name){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,px,px);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()})};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function plQR(p){const url=plUrl(p);if(!url)return alert('Imposta prima in Impostazioni l\'indirizzo base delle e-label.');let svg;try{svg=qrSVG(url)}catch(e){return alert(e.message)}
  const f=modal('QR · '+p.nome,`<div style="text-align:center"><div style="width:220px;margin:0 auto">${svg.replace(/width="\d+" height="\d+"/,'width="220" height="220"')}</div><p><b>${esc(url)}</b></p><p class="tabs" style="justify-content:center"><button type="button" data-qx="svg">${I('dl')}SVG per tipografia</button><button type="button" data-qx="png">${I('dl')}PNG 1200 px</button><button type="button" data-qx="copy">Copia link</button></p></div>
  <p class="muted">QR statico, senza servizi esterni né scadenze: punta per sempre a questo indirizzo. Prima di mandarlo in stampa pubblica la pagina e verifica che si apra. Lato minimo consigliato in stampa: 1,5 cm.</p>${p.qr_stampato?'<p><span class="badge b-ok">Segnato come in stampa: indirizzo bloccato</span></p>':''}`,()=>{if(p.qr_stampato)return true;const x=DB.get('pl',p.id);x.qr_stampato=true;DB.upsert('pl',x);toast('Indirizzo bloccato')},p.qr_stampato?'Chiudi':'Segna come in stampa');
  f.addEventListener('click',e=>{const k=e.target.closest('[data-qx]')?.dataset.qx;if(!k)return;const nm='qr-'+p.slug;
    if(k==='svg')download(nm+'.svg',svg,'image/svg+xml');else if(k==='png')svgPng(svg,1200,nm+'.png');else navigator.clipboard?.writeText(url).then(()=>toast('Link copiato'))})}
function filesModal(c,p){const CAT=c==="pl"?PLCAT:FLCAT;const rows=p.files||[];
  const f=modal('File · '+(p.nome||p.num),`<div class="grid">${fieldHTML(['cat','Categoria','sel',0,CAT],CAT[0])}<label class="full"><span>Aggiungi file (anche più di uno)</span><input type="file" name="up" multiple></label></div><h4>Archivio (${rows.length})</h4>${tbl([{h:'File',v:x=>esc(x.name)},{h:'Categoria',v:x=>esc(x.cat)},{h:'Peso',n:1,v:x=>fmtSize(x.size)},{h:'Data',v:x=>dIT(x.added)},{h:'',a:1,v:x=>`<button type="button" class="sm" data-fx="get" data-fid="${x.id}" title="Scarica">${I('dl')}</button><button type="button" class="sm" data-fx="del" data-fid="${x.id}" title="Elimina">${I('del')}</button>`}],rows)}<p class="muted">I file sono salvati nello spazio protetto di Growing Liquids (Supabase), visibili da tutte le postazioni con accesso. Massimo 25 MB a file. Non entrano nel backup JSON.</p>`,f=>{
    const files=[...f.elements.up.files];if(!files.length)return true;const cat=f.elements.cat.value;navigator.storage?.persist?.();
    Promise.all(files.map(async fl=>{const id=uid();await FS.put(id,fl);return{id,name:fl.name,type:fl.type,size:fl.size,cat,added:today()}}))
      .then(meta=>{const x=DB.get(c,p.id);x.files=[...(x.files||[]),...meta];DB.upsert(c,x);toast(meta.length+' file salvati');render();filesModal(c,x)}).catch(e=>alert('Errore nel salvataggio: '+e.message))},'Carica');
  f.addEventListener('click',async e=>{const b=e.target.closest('[data-fx]');if(!b)return;const fid=b.dataset.fid,x=DB.get(c,p.id),meta=x.files.find(m=>m.id===fid);
    if(b.dataset.fx==='get'){const blob=await FS.get(fid);if(!blob)return alert('File non trovato nello spazio condiviso: potrebbe essere stato caricato da un browser che non è ancora entrato nel nuovo gestionale.');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=meta.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
    else if(confirm('Eliminare '+meta.name+'?')){await FS.del(fid);x.files=x.files.filter(m=>m.id!==fid);DB.upsert(c,x);$('#dlg').close();render();filesModal(c,x)}})}

      location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(`Promemoria pagamento fattura ${d.numero}/${d.anno}`)}&body=${encodeURIComponent(body)}`},
    'p-liq':()=>{const x=o();x.provv_liq=x.provv_liq?null:today();DB.upsert('ordini',x);render()},'p-print':printProvv,
    backup:()=>download(`${CONFIG.lsPrefix}backup-${today()}.json`,DB.dump(),'application/json'),
    reset:()=>{if(DB.pending())return alert('Ci sono modifiche non ancora inviate al server: aspetta che la connessione torni prima di svuotare la copia locale.');if(confirm('Svuotare la copia locale e ricaricare tutto dal server? I dati sul server non vengono toccati.'))DB.reset()}
  })[b.dataset.act]?.()});
document.addEventListener('input',e=>{if(e.target.closest('#pcalc'))return pcUpdate();const k=e.target.dataset.q;if(k===undefined)return;st.q[k]=e.target.value;const pos=e.target.selectionStart;render();const n=$(`[data-q="${k}"]`);n.focus();n.setSelectionRange(pos,pos)});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('dialog'))return;
  if(t.id==='pc-pid'){const p=DB.get('prodotti',t.value),r=$('#pcalc');r.querySelector('[data-pc="pf"]').value='';r.querySelector('[data-pc="base"]').value=p?r4(avgCost(p,stockMap()[p.id])):'';return pcUpdate()}
  if(t.closest('#pcalc'))return pcUpdate();
  /* nei campi data il ridisegno aspetta l'uscita dal campo: altrimenti mentre si scrive l'anno il cursore si perde */
  const rr=()=>{if(t.type==='date'&&document.activeElement===t){t.onblur=()=>{t.onblur=null;render()};return}render()};
  if(t.dataset.navhide){t.checked?navHide.delete(t.dataset.navhide):navHide.add(t.dataset.navhide);try{localStorage.setItem(_lsKey('navhide'),JSON.stringify([...navHide]))}catch{}render();return}
  if(t.dataset.s){st[t.dataset.s]=t.value;rr()}else if(t.dataset.pf){st.pf[t.dataset.pf]=t.value||undefined;rr()}else if(t.dataset.inv){st.inv[t.dataset.inv]=t.value;render()}else if(t.dataset.af){st.af[t.dataset.af]=t.value||undefined;rr()}
  else if(t.id==='restore'&&t.files[0])t.files[0].text().then(j=>{if(!confirm('Ripristinare il backup? I record del file sostituiscono quelli con lo stesso codice sul server, per tutte le postazioni.'))return;try{toast(DB.load(j)+' record in ripristino');render()}catch(err){alert(err.message)}})});
document.addEventListener('submit',e=>{if(e.target.id!=='setf')return;e.preventDefault();const s=DB.settings();s.azienda=readForm(e.target,AZF,s.azienda||{});DB.saveSettings();toast('Dati salvati');render()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==st.view&&!/=/.test(h)){st.view=h;render()}});
authStart();
</script>
